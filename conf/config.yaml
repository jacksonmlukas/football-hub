defaults:
  - hub_config
  - _self_

# Overrides live here. Anything not listed uses the dataclass default in src/hub/config.py.
# Sweep from the CLI:  uv run python -m hub.draft.tune --sweep
# (this used to document a Hydra multirun against hub.draft.board, which is
#  argparse-only and rejects -m. The sweep lives in hub.draft.tune instead.)
roster:
  teams: 12
  slot: 3
  wr: 3

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
