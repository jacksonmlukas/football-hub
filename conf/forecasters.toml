# The paired retrieval arm (#511; docs/prereg/llm-forecasters.md, Contestants, 2026-10-22):
# the LLM named here, same settings, its own line-aware packet plus a Tavily news search per
# game (hub.forecasters.retrieval: 4 searches a game, one credit each).
# season_credit_cap: Tavily credits, counted apart from dollars. ~64 a 16-game week, ~650 for
# weeks 9-18; 1,500 leaves room for reruns and stays far under the ~9k promo balance.
# usd_per_credit: what one credit costs, priced into the dollar cost log -- 0 while the promo's
# credits are free, Tavily's published per-credit price once they are not.
[retrieval]
paired_with = "TBD"           # TBD: one of the [[llm]] names above
season_credit_cap = 1500
usd_per_credit = -1.0         # TBD: pinned from Tavily's pricing and the promo's terms
