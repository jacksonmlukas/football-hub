name: LLM forecaster model change
description: A pinned LLM in the forecaster study was deprecated, moved, or went down. Becomes a row in the prereg's deviations log.
title: "model change: <contestant> <old id> -> <new id>"
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        For `conf/forecasters.toml` `[[llm]]` pins only. A change to the hub's own model uses the
        "Model change" template. Under `docs/prereg/llm-forecasters.md`, a change after v0 gets a
        row in the deviations log **before it takes effect**.
  - type: dropdown
    id: contestant
    attributes:
      label: Contestant
      options: [llm1, llm2, llm3, llm4, retrieval arm]
    validations:
      required: true
  - type: input
    id: old_model_id
    attributes:
      label: Old model id
      description: The pinned `model_version`, exactly as in conf/forecasters.toml.
    validations:
      required: true
  - type: input
    id: new_model_id
    attributes:
      label: New model id
      description: The id that replaces it, or "none" if the contestant stops.
    validations:
      required: true
  - type: input
    id: date_noticed
    attributes:
      label: Date noticed
      description: YYYY-MM-DD
    validations:
      required: true
  - type: dropdown
    id: reason
    attributes:
      label: Reason
      options: [provider deprecation, alias moved, outage]
    validations:
      required: true
  - type: dropdown
    id: leaves_holm_family
    attributes:
      label: H1 consequence - leaves the Holm family?
      description: >-
        Per the prereg's exclusions table, a deprecated model's contestant ends when the deprecation
        is announced and leaves H1 and H2, which then cover the models still running. (The "stays in
        with p = 1" rule is for a fit that fails on the scored games, not for a deprecation.)
      options: [yes - deprecated, the contestant ends and leaves H1 and H2, no - not a deprecation (outage or alias resolved to the same model), undecided]
    validations:
      required: true
  - type: dropdown
    id: resets_contestant
    attributes:
      label: H2 consequence - does a substitute count?
      description: >-
        No substitute counts toward the confirmatory tests (prereg, Contestants). A replacement model's
        games are reported as exploratory only, unless the maintainer reruns the burn-in before
        prereg-llm-v1 and records it as a deviation.
      options: [no - the substitute is exploratory only, burn-in rerun before v1 (logged deviation), undecided]
    validations:
      required: true
  - type: textarea
    id: deviations_row
    attributes:
      label: Deviations-log row
      description: Date, change, reason, and whether it affects the confirmatory tests.
