name: llm-forecast
# The LLM-forecaster study's daily run (docs/prereg/llm-forecasters.md, "Forecast procedure").
#
# **Switched off until `prereg-llm-v0` is tagged.** The job runs only when the repository
# variable LLM_FORECASTS_ENABLED is 'true'; it is unset, so every trigger is a skipped job. The
# schedule stays live rather than commented out -- a commented-out schedule is what
# `scripts/preflight_public.sh` warns about, and `tests/contracts/test_forecast_workflow.py`
# reads the crons. Enabling is setting the variable, after the tag (build step 7).
#
# **Why fifteen triggers for one run.** GitHub schedules in UTC and delays or drops scheduled
# runs under load. Every 15 minutes at off-round minutes, 13:52-16:22 UTC, covers 09:30-11:30 ET under daylight (UTC-4)
# and standard (UTC-5) time; each trigger asks `should-run`, which converts to ET in code and
# says no outside the window or once the day is marked done. The list is
# `hub.forecasters.days.CRON_TRIGGERS_UTC`, and the contract test holds the two to each other.
#
# **Where output goes.** Saved as a workflow artifact first, then committed to the `forecasts`
# branch, which only this workflow writes, so a code push never conflicts with it and a
# commit's author is this workflow. Nothing is committed to main. Partial output from a failed
# run is still saved and committed (every record is complete on its own); the day is marked
# done only after `run` succeeds, so the next trigger fills the gaps.
#
# **Failure.** A failed run emails the repository owner through GitHub's own workflow-failure
# notification; the Tuesday scoring job lists any completed game with no forecast.

on:
  schedule:
    # Off-round minutes (#544): GitHub drops scheduled runs at round minutes under load, and on
    # 2026-11-02 none of the 13 round-minute triggers fired (3 of 13 fired, hours late, on 10-31
    # and 11-01). 13:52 is an early attempt; 14:07-16:22 every 15 minutes covers 09:30-11:30 ET
    # under standard time (UTC-5), the season's offset from 2026-11-01.
    - cron: "52 13 * * *"
    - cron: "7,22,37,52 14-15 * * *"
    - cron: "7,22 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: llm-forecast
  cancel-in-progress: false

jobs:
  forecast:
    if: vars.LLM_FORECASTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    # A run must finish within 30 minutes for the 60-minute-before-kickoff rule to cut nothing
    # (the prereg's arithmetic); this bounds a wedged run a little beyond that.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Check out the forecasts branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin forecasts:forecasts; then
            git worktree add forecasts-branch forecasts
          else
            git worktree add --orphan -b forecasts forecasts-branch
          fi

      - name: Gate on the 09:30-11:30 ET window and an unfinished day
        id: gate
        run: uv run python -m hub.forecasters.cli should-run --out forecasts-branch >> "$GITHUB_OUTPUT"

      - name: Forecast the day's games
        if: steps.gate.outputs.run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # One repository secret per provider (`hub.forecasters.providers.KEY_ENV`), never in
          # `.env`, so an agent lane cannot spend. TAVILY_API_KEY is the paired retrieval
          # arm's news search (#511, `hub.fetch.tavily`); a run whose config names the arm
          # refuses without it, before the market snapshot.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: uv run python -m hub.forecasters.cli run --out forecasts-branch --day "${{ steps.gate.outputs.day }}"

      - name: Mark the day done
        if: steps.gate.outputs.run == 'true'
        run: uv run python -m hub.forecasters.cli mark-done --out forecasts-branch --day "${{ steps.gate.outputs.day }}"

      # Timestamp receipts (#449): each day's forecast file is submitted to the public
      # OpenTimestamps calendars and the receipt kept beside it as `<file>.ots`, on `forecasts`.
      # Best effort -- an outage logs and exits 0, the file stays unreceipted, and the next run
      # stamps it. Only this gated workflow stamps (tests/contracts/test_receipts_wiring.py).
      - name: Stamp the forecast files
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: uv run python -m hub.forecasters.receipts stamp-pending forecasts-branch

      # Upgrade pending receipts (#535): ask each calendar for the completed Bitcoin timestamp of
      # every receipt still pending and write it in place. A receipt Bitcoin has not confirmed
      # yet stays pending with no error; an outage changes nothing. Best effort, same gate.
      - name: Upgrade pending timestamp receipts
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: uv run python -m hub.forecasters.receipts upgrade-pending forecasts-branch

      - name: Save the output as an artifact
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: forecasts-${{ steps.gate.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: forecasts-branch/
          if-no-files-found: warn
          retention-days: 90

      - name: Commit to the forecasts branch
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          git -C forecasts-branch add -A
          if git -C forecasts-branch diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git -C forecasts-branch commit -m "forecasts ${{ steps.gate.outputs.day }} (run ${{ github.run_id }})"
          for attempt in 1 2 3; do
            if git -C forecasts-branch push origin forecasts; then exit 0; fi
            git -C forecasts-branch pull --rebase origin forecasts
          done
          echo "::error::could not push to the forecasts branch after three attempts"
          exit 1
