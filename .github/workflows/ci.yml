name: ci
on:
  push:
  pull_request:
  # Off while the repo was private, for the metering reason watchdog.yml sets out. Until
  # 2026-08-24 this trigger was absent entirely while the `golden` job below gated on
  # `github.event_name == 'schedule'` -- so the job could never fire, had never once run, and
  # its own comment described it as nightly. README claimed the same. c984746 turned it on.
  #
  # `scripts/preflight_public.sh` checks whether this block is commented out. That is not
  # recorded here, because the comment that recorded it was wrong within the hour.
  schedule:
    - cron: "0 9 * * *"

  # The golden job was unreachable without this, which is how it went from being written to
  # being fixed twice without ever having run. Kept after the schedule went back on, because
  # on-demand is still how you exercise it after touching it rather than waiting for 09:00.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # `uv sync`, not `uv venv && uv pip install -e .`: the latter is the legacy interface,
      # and matching what SETUP.md and the Makefile tell a human to run means CI exercises
      # the documented path rather than a parallel one.
      - run: uv sync --all-extras
      - run: uv run ruff check src tests
      - run: uv run pyrefly check
      # Raised 80 -> 88 on 2026-08-27. The remaining uncovered code is network-bound
      # (espn.poll, league_settings, availability.historical_picks) or expensive harness
      # CLIs. Covering those means stubbing six things to assert an exit code, which is the
      # shape of test this repo has a documented incident about.
      - run: uv run pytest tests/unit tests/contracts -q --cov=hub --cov-fail-under=88

  golden:
    # Hits the real APIs and diffs against frozen fixtures. Scheduled, not on PRs, because a
    # third-party schema change should not block a docs commit.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      # `-m golden`, NOT `tests/golden`. pyproject sets `addopts = "-m 'not golden'"`, so
      # naming the directory deselects all seven and exits 0 -- a green job that ran nothing.
      # This job was already fixed once, on 2026-08-24, for a trigger that could never fire;
      # the trigger was the reason it never ran, and this was the reason it would not have
      # tested anything when it did.
      - run: uv run pytest -m golden -q
        env:
          # Without a key the CFBD shape check skips -- its designed behaviour, and from the
          # outside indistinguishable from a green run. `docs/going-public.md` carried "add
          # CFBD_API_KEY and pass it to that job" as a manual step until the secret was added
          # on 2026-09-04; this is the half of it that lives in the repo.
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
