name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run ruff check src tests
      - run: uv run pyrefly check
      - run: uv run pytest tests/unit tests/contracts -q --cov=hub --cov-fail-under=80

  golden:
    # Hits the real APIs and diffs against frozen fixtures. Nightly, not on PRs,
    # because a third-party schema change should not block a docs commit.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run pytest tests/golden -q
