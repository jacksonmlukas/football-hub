name: pages

# Publishes `site/` as the Pages root, replacing the branch source.
#
# The branch source can only serve `/` or `/docs`. `site/` is neither, so serving from `main`
# put the dashboard at `/football-hub/site/` and left the root empty -- patched on 2026-09-04
# with a root `index.html` carrying a meta refresh. That works in a browser and nowhere else:
# a meta refresh is not an HTTP 3xx, so `curl -L` and anything else that follows real
# redirects stops at the landing page. An artifact upload has no such constraint: whatever
# directory is uploaded *is* the root.
#
# **This deploys what is committed; it does not run `hub.publish`.** Generating the JSON in CI
# would need the ESPN cookies and both API keys as repository secrets, and -- the deciding
# reason -- it would break the record. `docs/track-record.md` rule 1 says a prediction counts
# only if its commit predates kickoff, which is why `publish.predictions` writes one artifact
# per week and its docstring says "the git history pins each week to a commit". Publishing
# straight to Pages would leave nothing to pin. The commit is the timestamp.

on:
  push:
    branches: [main]
    # Only when something the site actually serves changes. A docs commit should not redeploy.
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"

  # The scheduled slate commits `site/data` and that push deploys nothing, because GitHub
  # does not let a push made with `GITHUB_TOKEN` trigger another workflow -- a deliberate
  # guard against a job that commits and re-triggers itself forever.
  #
  # So the slate published to git and never to the site. Every artifact was correct, committed
  # and invisible, and the only symptom was a page that quietly stopped changing. Found by
  # dispatching the slate and noticing no deploy followed it; reading either file alone shows
  # nothing wrong.
  #
  # `workflow_run` is the documented way across that guard. It fires on the *completion* of
  # the slate, which is why the job below checks the conclusion: a slate that failed has
  # nothing worth deploying.
  workflow_run:
    workflows: [slate]
    types: [completed]

  # Every ten minutes through a game window, which is what makes the scores move.
  #
  # **The hours are a union over both daylight-saving states, not a fixed offset.** A cron
  # fires in UTC; games are played on Eastern, which is UTC-4 until early November and UTC-5
  # after it. These windows were written as fixed UTC hours annotated as Eastern, so the whole
  # window slid an hour earlier at the boundary -- gaining dead time before the first kickoff
  # and losing the hour a Sunday night game runs past midnight in. This repo has paid for the
  # fixed-offset assumption before: see `hub.fetch.odds._game_date` and `hub.schedule._kickoff`,
  # which both convert rather than offset. `tests/contracts/test_game_windows.py` holds these
  # crons against the Eastern clock in both states, so the third statement of the rule is the
  # first one that can fail.
  #
  # In Eastern, the windows are: Sunday noon to Monday 00:59; Saturday noon to Sunday 00:59
  # for college, whose marquee kickoffs are 19:30 and 20:00; Thursday and Monday 20:00 to
  # 00:59 for the standalone night games. Each block is one hour wider in UTC than either
  # offset needs, which is what covering both costs.
  #
  # **Only during windows.** A cron that ran all week would deploy a few thousand times a
  # month to publish a scoreboard with nothing on it, and the watchdog's threshold -- staleness
  # *during a game window* -- is written against exactly these hours.
  #
  # Free of quota: ESPN's scoreboard needs no key, which is why this needed nothing from #16.
  schedule:
    - cron: "*/10 16-23 * * 0"   # Sunday daytime ET
    - cron: "*/10 0-5  * * 1"    # Sunday night ET, into Monday morning
    - cron: "*/10 0-5  * * 2"    # Monday night ET
    - cron: "*/10 16-23 * * 6"   # Saturday daytime ET
    - cron: "*/10 0-5  * * 0"    # Saturday night ET -- college primetime, uncovered until now
    - cron: "*/10 0-5  * * 5"    # Thursday night ET

  workflow_dispatch:

# Read the repo, mint the Pages OIDC token, write the deployment. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one in flight: a half-applied deployment is worse
# than a redundant one. A queued run supersedes an older queued run, not a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # A slate that failed has nothing worth deploying. Every other trigger runs unconditionally,
    # which is why this reads as a condition on the event rather than on the workflow.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras

      # The overlay is not in the checkout -- ADR-0018 keeps it out of the record -- so the
      # previously published one is fetched back as last-good before it is refreshed. Without
      # this a deploy triggered by anything other than a game-window tick would ship a site
      # with no scores at all, and the panel would read "unavailable" every time the slate ran.
      #
      # `|| true`: no previous deploy, or a Pages 404, is a first run rather than a failure.
      - name: Carry forward the last published scores
        run: |
          mkdir -p site/data
          curl -sf --max-time 20 \
            "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/live.json" \
            -o site/data/live.json || echo "  no previously published overlay; this is a first run"

      # A failed fetch leaves the carried-forward file exactly as it is and says so, which is
      # the whole of last-good now that nothing is committed. `hub.publish.live` returns None
      # and writes nothing on failure; `|| true` covers the process, not the artifact.
      - name: Refresh the live scores
        run: uv run python -m hub.publish --live || true

      # Fail loudly rather than deploying an empty site. `upload-pages-artifact` is happy to
      # tar a directory holding nothing, and the result is a live 404 that looks like a
      # broken build rather than a broken commit.
      - name: Check the site has something to serve
        run: |
          test -f site/index.html || { echo "site/index.html is missing"; exit 1; }
          test -d site/data || { echo "site/data is missing"; exit 1; }
          echo "$(find site/data -name '*.json' | wc -l) artifacts to publish"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
