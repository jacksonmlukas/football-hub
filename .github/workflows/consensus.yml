name: consensus

# The weekly consensus page, captured before kickoff and committed (#432, #515).
#
# **Why a workflow and not a person.** The 2026 forward measurement of the Weekly projection
# against consensus (`docs/weekly-forward.md`) scores the incumbent on the ranking that could
# have been read before kickoff, and nothing in this repo kept one. A capture that depends on
# someone remembering is the system CLAUDE.md says dies in October; every week this does not run
# is a week the measurement may not count.
#
# **Four runs a week, Friday and Saturday (`--lineup`).** The archive publishes the page on
# Fridays -- every 2026 `weekly-op` scrape is Friday-dated. Each run takes the newest page dated
# after the previous week's last game and before the week's first Sunday and writes it to
# `state/consensus/<season>/lineup/`. Since ADR-0027 (2026-10-20) that capture is *in time* for
# every player whose kickoff it precedes -- Sunday's and Monday's -- so it is the week's capture
# both for the forward measurement, which leaves Thursday's players out of that week, and for
# setting the lineup (see `hub.fetch.consensus`). The runs are ordered against the publish that
# uses them: `slate.yml`'s Saturday 14:00 UTC full run writes `site/data/roster.json`, and the last
# run is Saturday 08:00 UTC, six hours ahead of it -- more than the 4-8.5h GitHub has been starting
# scheduled runs late (#468) only if both slip alike, so the Friday runs are the margin: a Friday
# capture is in the tree a day before the publish. The deadline the CLI enforces is the start of
# the first Sunday game day, Eastern (04:00 UTC in daylight time, 05:00 in standard).
#
# **The Tuesday and Wednesday runs are retired (2026-10-20, #515).** They took the week capture
# (`--capture`), which must precede Thursday's game day. In six weeks of 2026 they never once
# captured (every run exited 3), because no page is published before Friday; and under ADR-0027
# the most a pre-Thursday page could add is Thursday's players, about 2 of 14 games a week, which
# the archive has never offered. `--capture` stays reachable by dispatch (`purpose: week`) for a
# week when a page is published early.
#
# **A late capture is refused, not stored.** After its deadline the CLI writes nothing, and this
# workflow has nothing to commit; the harness separately reads every file in the tree on the
# later of its own time and its first commit, whatever the file says about itself.
#
# **An empty run near its deadline is red, not a notice.** `--lineup` exits 3 ("nothing yet")
# with a day or more left before Sunday's deadline, and 4 inside a day: by then no scheduled run
# is left to recover it before the lineup is published, and a green notice is how this workflow
# hid that the Tuesday-Wednesday capture had never once been written. 4 fails the step.
#
# The slate's concurrency group, because both commit under `state/` and two runs rebasing onto
# each other's commit is the race that group exists for.
on:
  schedule:
    - cron: "0 13 * * 5"    # Friday 13:00 UTC: the morning after Thursday's game
    - cron: "0 21 * * 5"    # Friday 21:00 UTC
    - cron: "0 3 * * 6"     # Saturday 03:00 UTC
    - cron: "0 8 * * 6"     # Saturday 08:00 UTC: the last before slate's 14:00 publish
  workflow_dispatch:
    inputs:
      purpose:
        description: "lineup (the Friday capture, in time for Sunday's and Monday's players) or week (before Thursday's game day, in time for every player)"
        type: choice
        options: [lineup, week]
        default: lineup

permissions:
  contents: write

concurrency:
  group: slate
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras

      # Exit 3 is "nothing to capture yet" (the page is not published, or the week's deadline
      # has passed) and is expected on most runs; any other non-zero is a failed fetch and
      # must turn the run red so a missed week is seen, not read about in January. Exit 4 is a
      # lineup run that found nothing inside a day of Sunday's deadline: red, with an error.
      # Every scheduled run is a Friday capture; a dispatch takes its `purpose`, `week` being the
      # only way left to the week capture. A cron this step does not know is a schedule edited
      # without it, and goes red rather than guessing which capture it meant.
      - name: Capture the next week's consensus page
        env:
          SCHEDULE: ${{ github.event.schedule }}
          PURPOSE: ${{ inputs.purpose }}
        run: |
          case "${SCHEDULE:-}" in
            "0 13 * * 5"|"0 21 * * 5"|"0 3 * * 6"|"0 8 * * 6") flag=--lineup ;;
            "") if [ "${PURPOSE:-lineup}" = week ]; then flag=--capture; else flag=--lineup; fi ;;
            *) echo "::error::cron '${SCHEDULE}' is not one this step routes"; exit 1 ;;
          esac
          code=0
          uv run python -m hub.fetch.consensus "$flag" || code=$?
          if [ "$code" -eq 3 ]; then
            echo "::notice::nothing captured this run ($flag); the next scheduled run tries again"
            exit 0
          fi
          if [ "$code" -eq 4 ]; then
            echo "::error::no consensus page captured for Sunday's lineup and the deadline is under a day away; the lineup will be set on last-good ECR or mu"
          fi
          exit "$code"

      # Only when something was written. The capture is a record, so a run that wrote one and
      # did not commit it is the failure this directory exists to prevent.
      - name: Commit what was captured
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `state`, not `state/consensus`: a run that captured nothing (exit 3) in a tree with no
          # consensus directory yet would die at the pathspec (the shape of #424), and `state` exists.
          git add state
          if git diff --cached --quiet; then
            echo "nothing changed; no commit"
            exit 0
          fi
          git commit -m "consensus: week capture ($(date -u +%Y-%m-%dT%H:%MZ))

          A Friday capture (lineup/wkNN/lineup-*) is taken after Thursday's games and is in
          time for every player whose kickoff it precedes (ADR-0027); a week capture
          (wkNN/cap-*) is taken before the week's first game day -- see
          docs/weekly-forward.md and docs/track-record.md rule 1."
          git pull --rebase origin main
          git push
