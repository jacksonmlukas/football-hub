name: watchdog
# External watchdog. Deliberately NOT running on the machine that hosts the poller --
# a process that dies cannot report its own death.
on:
  # This ran while the repo was private and should not have. Private repos are metered at
  # 2,000 free Actions minutes a month; by 2026-08-24 this cron had logged 42 runs watching a
  # poller that does not start until Week 1, and GitHub bills a minimum of one minute per job,
  # so each ~10s run cost a full minute: roughly 126 runs and 126 minutes a week, about 27% of
  # the allowance, to watch nothing. faffc2a switched it off; c984746 switched it back on at
  # the flip, public repos being unmetered. This is the one place that history is written down.
  #
  # Whether the block below is commented out is checked by `scripts/preflight_public.sh`
  # rather than stated here: the comment that used to state it went on saying SCHEDULE
  # DISABLED after c984746 turned the block on.
  #
  # Each of `live.yml`'s game windows, **less its first hour**, and nothing else.
  #
  # Two rules, both learned from this file reporting the wrong thing.
  #
  # *Never wider than what it watches.* The watchdog checks the overlay `live.yml` refreshes,
  # so an hour it watches and nothing refreshes is a gap between two schedules being reported
  # as an outage. It used to skip the Thursday and Monday night windows entirely, which was
  # the other direction of the same mismatch: a monitor that is not watching.
  #
  # *Never the opening hour.* Staleness is measured against the last refresh and the refresh
  # runs on the same cadence, so the first tick of a window looks at an artifact last written
  # before the window opened -- an incident by construction, twice a week for eighteen weeks.
  # Starting an hour in means the deploy has already run six times by the first check.
  #
  # *Never trusted to have run when it was asked to.* A cron here is a request for a start.
  # GitHub queues scheduled workflows and drops them under load -- `live.yml` records these
  # starts arriving 97-126 minutes apart -- so a run placed inside a window executes outside
  # it often enough that #193 is the second incident this file has filed for a reason that
  # was never about the thing it watches. The two rules above place the crons; they cannot
  # place the *runs*, so the job below asks where it actually landed before it measures
  # anything.
  #
  # The hours follow Eastern in both daylight-saving states, for the reason `live.yml`
  # spells out. `tests/contracts/test_game_windows.py` asserts all three rules against both
  # files.
  schedule:
    - cron: "*/10 17-23 * * 0"   # Sunday daytime, from an hour into the window
    - cron: "*/10 0-5  * * 1"    # Sunday night -- the window has been open since 16:00 UTC
    - cron: "*/10 1-5  * * 2"    # Monday night
    - cron: "*/10 17-23 * * 6"   # Saturday daytime
    - cron: "*/10 0-5  * * 0"    # Saturday night
    - cron: "*/10 1-5  * * 5"    # Thursday night
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  # The season's first game. A fact about the calendar, not a copy of the window's hours --
  # the same reason `live.yml` is allowed to hold "Saturday is college" while holding no
  # copy of the window itself.
  #
  # It exists because the crons above fire every week of the year, so in August a run can be
  # perfectly inside its window and still be watching an overlay that no game will ever move.
  # #193 was filed on the Monday before this date and could not clear: the next
  # Monday-adjacent cron was the Tuesday and the first game was the Wednesday, so no healthy
  # check could occur before kickoff.
  #
  # A date in the past suppresses nothing, so leaving this stale next August costs monitoring
  # of a preseason nobody is watching rather than silence in a season somebody is.
  # `tests/contracts/test_game_windows.py` holds that direction.
  SEASON_OPENS: "2026-09-09"

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # **Whether this run is still inside the window it was scheduled for**, which is the
      # context the check below cannot see and without which its number means nothing.
      #
      # A cron is a request for a start, not a guarantee of one: GitHub queues scheduled
      # workflows and drops them under load, and `live.yml` records those starts being
      # delivered 97-126 minutes apart. So a run scheduled inside a window routinely executes
      # after it, at which point the `live` loop has stopped, nothing is refreshing
      # `live.json`, and its age growing is the correct state rather than a failure.
      #
      # The cron string GitHub hands the run *is* the window definition, so nothing here
      # restates which hours a window covers -- the drift this repo keeps paying for.
      - name: Which window this run is in
        id: window
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set +e
          STATE=$(.github/scripts/window_state.sh "$SCHEDULE" "$SEASON_OPENS")
          echo "state=${STATE%% *}" >> "$GITHUB_OUTPUT"
          case "$STATE" in *" "*) echo "detail=${STATE#* }" ;; *) echo "detail=" ;; esac \
            >> "$GITHUB_OUTPUT"
          echo "at=$(date -u +%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "cron=${SCHEDULE:-none}" >> "$GITHUB_OUTPUT"
          echo "window state: $STATE (cron '${SCHEDULE:-none}')"

      # The check is a script rather than eight lines of inline shell because it could not
      # pass and nothing could see that. It read `.ts`, which only `hub.fetch.espn.poll`
      # writes -- `hub.publish.live` writes the file the page reads and has never carried
      # that field -- and `jq -r '.ts // 0'` turned the absence into an age of `now - 0`.
      # Every run reported 56.7 years of staleness and none could reach the healthy branch
      # that closes an incident. `tests/contracts/test_watchdog_heartbeat.py` now pins it.
      - name: Check published heartbeat
        id: check
        run: |
          set +e
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/live.json"
          # 1500s, not 600, and unchanged by issue #91. The overlay is republished every
          # five minutes during a window, so this is now a 5x margin rather than the 2.5x it
          # was against the old ten-minute cron -- it alarms on a genuine failure rather than
          # on jitter. It was never the threshold that was wrong: the refresh the threshold
          # was written against was being delivered every ~106 minutes.
          #
          # The cost is that a genuinely dead publisher goes unreported for up to twenty-five
          # minutes. The page serves last-good throughout, so that is a delay in learning
          # rather than a delay in the page working.
          RESULT=$(.github/scripts/heartbeat.sh "$URL" 1500)
          echo "age=$(echo "$RESULT" | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          # Three different failures, reported apart, because they have three different
          # fixes: start the poller, republish the site, or reconcile writer and monitor.
          case "$RESULT" in
            ok*)          echo "stale=false" >> "$GITHUB_OUTPUT" ;;
            stale*)       echo "stale=true"  >> "$GITHUB_OUTPUT"
                          echo "why=the published live.json has not been refreshed" >> "$GITHUB_OUTPUT" ;;
            unreachable*) echo "stale=true"  >> "$GITHUB_OUTPUT"
                          echo "age=unknown" >> "$GITHUB_OUTPUT"
                          echo "why=the published live.json could not be fetched" >> "$GITHUB_OUTPUT" ;;
            *)            echo "stale=true"  >> "$GITHUB_OUTPUT"
                          echo "age=unknown" >> "$GITHUB_OUTPUT"
                          echo "why=live.json carries no readable generated_at, so its writer and this check disagree about the schema" >> "$GITHUB_OUTPUT" ;;
          esac

      # The two readings put together: an age, and whether an age was expected to move.
      #
      # A stale heartbeat is only evidence of a stall when something was supposed to be
      # refreshing it. Two states mean nothing was:
      #
      #   * `late` / `early` -- this run executed outside the window it was scheduled for.
      #     The `live` loop is not running, so the age is the correct state. It files
      #     nothing; the in-window runs ten minutes apart are what catch a real stall, and
      #     a delayed run pretending to be one of them is how #193 happened.
      #   * `preseason` -- there is no window at all yet, so there is nothing to be late for.
      #     This one *closes* a standing incident: before the first game a stale heartbeat is
      #     unfounded whoever filed it, and an incident that has to wait for a game to clear
      #     is an incident that teaches an operator to skim the watchdog.
      #
      # Every other state -- inside a window, a dispatch an operator asked for, a cron this
      # check could not read -- measures. The fall-throughs point at monitoring, never at
      # silence.
      - name: What this run can conclude
        id: verdict
        run: |
          AT="${{ steps.window.outputs.at }}"
          CRON="${{ steps.window.outputs.cron }}"
          case "${{ steps.window.outputs.state }}" in
            preseason)
              echo "verdict=no-window" >> "$GITHUB_OUTPUT"
              echo "reason=preseason"  >> "$GITHUB_OUTPUT"
              echo "closes=true"       >> "$GITHUB_OUTPUT"
              # `not planned`, and the close reason is the distinction the ticket record
              # keeps after the comment has scrolled away: this incident did not end, it was
              # never founded. `docs/agents/issue-tracker.md` -- never close without a reason,
              # because a bare close silently records `completed` and stops discriminating.
              echo "close_reason=not planned" >> "$GITHUB_OUTPUT"
              {
                echo "close_note<<NOTE"
                echo "Closed without a healthy check, because no healthy check is possible yet."
                echo "The season's first game is ${{ steps.window.outputs.detail }} and no game"
                echo "window has opened, so nothing refreshes live.json and its age growing is the"
                echo "correct state rather than a failure. This incident was filed against a"
                echo "heartbeat nobody expected to move."
                echo "NOTE"
              } >> "$GITHUB_OUTPUT" ;;
            late|early)
              echo "verdict=no-window" >> "$GITHUB_OUTPUT"
              echo "reason=delayed"    >> "$GITHUB_OUTPUT"
              echo "closes=false"      >> "$GITHUB_OUTPUT" ;;
            *)
              if [ "${{ steps.check.outputs.stale }}" = "true" ]; then
                echo "verdict=stale"   >> "$GITHUB_OUTPUT"
                echo "closes=false"    >> "$GITHUB_OUTPUT"
              else
                echo "verdict=healthy" >> "$GITHUB_OUTPUT"
                echo "closes=true"     >> "$GITHUB_OUTPUT"
                echo "close_reason=completed" >> "$GITHUB_OUTPUT"
                {
                  echo "close_note<<NOTE"
                  echo "Heartbeat healthy again, measured at $AT inside the window this run was"
                  echo "scheduled for (cron '$CRON')."
                  echo "NOTE"
                } >> "$GITHUB_OUTPUT"
              fi
              # What the incident body says about where its number came from, so a reader can
              # tell a stall from a late arrival without going to the clock themselves.
              #
              # Quoted with apostrophes rather than backticks deliberately: this text is
              # substituted into a double-quoted bash string in the filing step below, where a
              # backtick is a command substitution rather than markdown.
              {
                echo "measured<<NOTE"
                case "${{ steps.window.outputs.state }}" in
                  inside)      echo "Measured at $AT, inside the window this run was scheduled for (cron '$CRON', which still had ${{ steps.window.outputs.detail }}s to run)." ;;
                  unscheduled) echo "Measured at $AT by a manual dispatch, which has no window behind it to be inside of." ;;
                  *)           echo "Measured at $AT; the cron behind this run ('$CRON') could not be read, so this check could not confirm it is inside its window." ;;
                esac
                echo "NOTE"
              } >> "$GITHUB_OUTPUT" ;;
          esac
          echo "window ${{ steps.window.outputs.state }}, heartbeat stale=${{ steps.check.outputs.stale }}"

      # `set +e` and the `||` fallbacks are the point of this step, not defensive noise.
      # On 2026-09-04 the label did not exist in the repo, `gh issue create --label` failed,
      # and the whole job exited 1 -- so the watchdog reported nothing at exactly the moment
      # it had something to report. It had passed every earlier run only because the
      # heartbeat was fresh and it never reached this branch: a monitor that works while
      # nothing is wrong. Filing the incident is the job; the label is decoration, and
      # decoration must never be able to silence the alarm.
      - name: File or update the incident issue
        if: steps.verdict.outputs.verdict == 'stale'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # The marker, not the label. `incident` says what an issue is *about*; this says
          # who filed it. Both branches need it and for the same reason -- the close branch
          # was shutting a human's issue with a comment about the heartbeat, and a dedupe on
          # the label alone would latch onto that same issue and comment on it forever
          # instead of ever filing one of its own, leaving nothing marked for recovery to
          # close. Fixing one half and not the other just moves the failure.
          MARKER="<!-- watchdog-heartbeat -->"
          # Deduped to one open incident at a time, never 200 issues. If the lookup fails the
          # dedupe degrades rather than the step dying -- worst case a second issue, which is
          # noisy and visible, against a silent failure which is neither.
          EXISTING=$(gh issue list --repo "${{ github.repository }}" \
            --label incident --state open --json number,body \
            --jq "([.[] | select(.body | contains(\"$MARKER\"))][0].number) // empty" 2>/dev/null)
          BODY="$MARKER
          Heartbeat age: ${{ steps.check.outputs.age }}s (threshold 1500s).

          Cause: ${{ steps.check.outputs.why }}.

          \`live.json\` is stamped by whatever last wrote it — the \`live\` workflow's loop
          every five minutes through a window, or \`hub.publish.live\` on a slate refresh.
          Nothing having run for twenty-five minutes means the page's scores are frozen, or
          that ESPN has been unreachable for that long: the loop holds the stamp rather than
          republishing a cached board, so a flat heartbeat is the honest report of both.

          The dashboard serves last-good state, so nothing is broken — it is just not moving.

          ${{ steps.verdict.outputs.measured }}

          An incident is only ever filed from inside a window, so this is a stall rather than
          a run that arrived late — GitHub delays scheduled workflows by tens of minutes, and
          a watchdog run that executes after its window closed reports that instead of
          measuring a heartbeat nothing is expected to move (#208). This issue closes on the
          next healthy check inside a window, or on the first check before the season's first
          game, whichever reaches it first."
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "Live poller down" --label incident --body "$BODY" \
              || gh issue create --repo "${{ github.repository }}" \
                   --title "Live poller down" --body "$BODY"
          fi
          if [ $? -ne 0 ]; then
            echo "::error::heartbeat is stale AND the incident could not be filed"
            exit 1
          fi

      # Only the incidents this workflow filed. It used to close every open issue carrying
      # the `incident` label, a human's included, with a comment about the heartbeat -- the
      # label describes the subject, not the author. `<!-- watchdog-heartbeat -->` is written
      # into the body above and matched here, so an issue a person opened about a genuine
      # outage survives the next healthy check.
      # Two ways an alarm stops standing, and one loop, because the dangerous half of this
      # step is which issues it touches rather than when it runs. A second copy of the marker
      # filter is a second place for it to drift back to closing a human's issue.
      #
      # The second way is the preseason one, and it is the half that clears #193 without
      # waiting for a game: a healthy check needs a window, the first window needs the first
      # game, and an incident that sits open across the two days before kickoff is what
      # teaches an operator to stop reading this workflow.
      - name: Close the incident on recovery, or when there was no window to be late for
        if: steps.verdict.outputs.closes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MARKER="<!-- watchdog-heartbeat -->"
          for n in $(gh issue list --repo "${{ github.repository }}" \
                      --label incident --state open --json number,body \
                      --jq ".[] | select(.body | contains(\"$MARKER\")) | .number"); do
            gh issue close "$n" --repo "${{ github.repository }}" \
              --reason "${{ steps.verdict.outputs.close_reason }}" \
              --comment "${{ steps.verdict.outputs.close_note }}"
          done

      # A run that executed outside its window files nothing and closes nothing: it cannot
      # observe health, and it must not report the absence of a refresh nobody asked for as
      # an outage. It says so where the run itself is read.
      #
      # The cost is that a genuinely dead publisher goes unreported by *this* run. The runs
      # ten minutes either side of it are inside the window and do report it, which is the
      # whole reason the watchdog runs every ten minutes rather than once.
      - name: Say that this run landed outside its window
        if: steps.verdict.outputs.reason == 'delayed'
        run: |
          {
            echo "### Outside its window, so nothing was measured"
            echo
            echo "Scheduled by cron \`${{ steps.window.outputs.cron }}\`, executed at"
            echo "${{ steps.window.outputs.at }} -- ${{ steps.window.outputs.state }} by"
            echo "${{ steps.window.outputs.detail }}s. The \`live\` loop only runs inside a"
            echo "window, so outside one the published heartbeat is expected to age and its"
            echo "age (${{ steps.check.outputs.age }}s) is not evidence of anything."
          } >> "$GITHUB_STEP_SUMMARY"

  # The Big Ten capture, watched the same way (#240). `bigten.yml` writes
  # `site/data/bigten.json` on the conference's deadlines with `generated_at` in the same
  # envelope shape `live.json` carries, and a capture that silently stops -- the cron
  # disabled, the page's shape changed at every deadline, the job failing before it commits
  # -- is a stall this workflow exists to report. The job above cannot see it: its window
  # logic is the live overlay's, and a deadline is not a game window.
  #
  # **The crons are the live job's, on purpose.** `tests/contracts/test_game_windows.py`
  # holds every cron in this file to `live.yml`'s windows, so a Big Ten cron here would be
  # reported as a monitor watching an hour nothing refreshes. A run on the live schedule
  # asks `hub.fetch.bigten --watch` whether *this moment* is inside a Big Ten window --
  # from `WATCH_DELAY` after a deadline until the next one fires -- and measures only if it
  # is. The two midweek deadlines no live cron sits after are still covered: a capture
  # stalled since Wednesday has not written past Friday's deadline either, and the Thursday
  # night run measures against that.
  #
  # **Read off the checkout, not the page.** `bigten.yml` commits the stamp and the commit is
  # the record; a push made with `GITHUB_TOKEN` triggers no deploy, so the published copy
  # lags the commit until something else deploys. `actions/checkout` has the commit.
  bigten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      # One line from the module that owns the deadlines, so the window is stated once. The
      # `${{ }}`-free shape is deliberate: `hub.fetch.bigten.watch` reads its own clock and
      # the committed file, and the workflow only carries the word it said.
      - name: Which Big Ten window this run is in, and what the stamp says
        id: watch
        run: |
          set +e
          LINE=$(uv run python -m hub.fetch.bigten --watch --status-path site/data/bigten.json)
          echo "line=$LINE" >> "$GITHUB_OUTPUT"
          echo "at=$(date -u +%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "bigten watch: $LINE"

      # The same three-way reading as the live job's verdict, on the module's line rather
      # than on two steps' outputs:
      #
      #   * `outside` -- the deadline fired less than the delay ago, so a late start may
      #     still be queued and a stale stamp is not yet evidence. Files nothing, closes
      #     nothing; the next run inside the window is what catches a real stall.
      #   * `preseason` -- nothing captures yet, so a standing incident is unfounded
      #     whoever filed it, and it closes.
      #   * everything else measures. `inside ... stale`, `unreachable`, `unreadable` and a
      #     line this step cannot read all file: the fall-throughs point at monitoring.
      - name: What this run can conclude about the capture
        id: capture
        run: |
          AT="${{ steps.watch.outputs.at }}"
          read -r WORD DEADLINE STATE REST <<<"${{ steps.watch.outputs.line }}"
          case "$WORD" in
            preseason)
              echo "verdict=no-window" >> "$GITHUB_OUTPUT"
              echo "reason=preseason"  >> "$GITHUB_OUTPUT"
              echo "closes=true"       >> "$GITHUB_OUTPUT"
              echo "close_reason=not planned" >> "$GITHUB_OUTPUT"
              {
                echo "close_note<<NOTE"
                echo "Closed without a healthy check, because no capture is due yet:"
                echo "$DEADLINE $STATE $REST. Nothing writes bigten.json before the first"
                echo "report, so its age growing is the correct state rather than a failure."
                echo "NOTE"
              } >> "$GITHUB_OUTPUT" ;;
            outside)
              echo "verdict=no-window" >> "$GITHUB_OUTPUT"
              echo "reason=delayed"    >> "$GITHUB_OUTPUT"
              echo "closes=false"      >> "$GITHUB_OUTPUT"
              echo "detail=deadline $DEADLINE fired less than the delay ago; its window opens in ${STATE}s" >> "$GITHUB_OUTPUT" ;;
            inside)
              if [ "$STATE" = "ok" ]; then
                echo "verdict=healthy" >> "$GITHUB_OUTPUT"
                echo "closes=true"     >> "$GITHUB_OUTPUT"
                echo "close_reason=completed" >> "$GITHUB_OUTPUT"
                {
                  echo "close_note<<NOTE"
                  echo "Capture healthy again: bigten.json was written ${REST}s ago, since the"
                  echo "$DEADLINE deadline, measured at $AT inside that deadline's window."
                  echo "NOTE"
                } >> "$GITHUB_OUTPUT"
              else
                echo "verdict=stale" >> "$GITHUB_OUTPUT"
                echo "closes=false"  >> "$GITHUB_OUTPUT"
                echo "why=the committed bigten.json predates the $DEADLINE deadline; it was last written ${REST}s ago and nothing has captured since" >> "$GITHUB_OUTPUT"
              fi ;;
            unreachable)
              echo "verdict=stale" >> "$GITHUB_OUTPUT"
              echo "closes=false"  >> "$GITHUB_OUTPUT"
              echo "why=there is no site/data/bigten.json in the checkout at all, so the capture has never left a record" >> "$GITHUB_OUTPUT" ;;
            unreadable)
              echo "verdict=stale" >> "$GITHUB_OUTPUT"
              echo "closes=false"  >> "$GITHUB_OUTPUT"
              echo "why=bigten.json carries no readable generated_at, so its writer and this check disagree about the schema" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "verdict=stale" >> "$GITHUB_OUTPUT"
              echo "closes=false"  >> "$GITHUB_OUTPUT"
              echo "why=the line hub.fetch.bigten --watch printed could not be read ('$WORD $DEADLINE $STATE $REST'), so this check could not establish anything and is reporting rather than staying quiet" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "capture verdict: $WORD $DEADLINE $STATE"

      # `set +e` and the `||` fallback, for the reason the live job gives: filing is the
      # job, the label is decoration, and decoration must not silence the alarm.
      - name: File or update the capture incident issue
        if: steps.capture.outputs.verdict == 'stale'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # Its own marker. The live branch closes only the heartbeat's and this branch
          # closes only this, so a healthy overlay never closes a stalled capture.
          MARKER="<!-- watchdog-bigten -->"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" \
            --label incident --state open --json number,body \
            --jq "([.[] | select(.body | contains(\"$MARKER\"))][0].number) // empty" 2>/dev/null)
          BODY="$MARKER
          Cause: ${{ steps.capture.outputs.why }}.

          \`site/data/bigten.json\` is committed by the \`bigten\` workflow at each of the
          conference's report deadlines (\`hub.fetch.bigten.DEADLINES\`). A stamp older than
          the most recent deadline, measured more than the delay a late start is allowed
          (\`hub.fetch.bigten.WATCH_DELAY\`) after it, means no capture ran for that deadline:
          the cron is off, the job failed before it committed, or the secret it commits with
          is gone. The archive is the record and a missed deadline is not recoverable later.

          Measured at ${{ steps.watch.outputs.at }} inside a Big Ten deadline window, on the
          live watchdog's schedule. A run inside the delay after a deadline reports that it is
          outside a window and files nothing, so this is a stall rather than a late start.
          This issue closes on the next healthy check inside a window, or on the first check
          before the season's first report."
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "Big Ten capture stalled" --label incident --body "$BODY" \
              || gh issue create --repo "${{ github.repository }}" \
                   --title "Big Ten capture stalled" --body "$BODY"
          fi
          if [ $? -ne 0 ]; then
            echo "::error::the Big Ten capture is stalled AND the incident could not be filed"
            exit 1
          fi

      - name: Close the capture incident on recovery, or when no capture is due yet
        if: steps.capture.outputs.closes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MARKER="<!-- watchdog-bigten -->"
          for n in $(gh issue list --repo "${{ github.repository }}" \
                      --label incident --state open --json number,body \
                      --jq ".[] | select(.body | contains(\"$MARKER\")) | .number"); do
            gh issue close "$n" --repo "${{ github.repository }}" \
              --reason "${{ steps.capture.outputs.close_reason }}" \
              --comment "${{ steps.capture.outputs.close_note }}"
          done

      - name: Say that this run landed outside every Big Ten window
        if: steps.capture.outputs.reason == 'delayed'
        run: |
          {
            echo "### Outside every Big Ten window, so the capture was not measured"
            echo
            echo "${{ steps.capture.outputs.detail }}. A capture scheduled at the deadline"
            echo "may still be queued, so the stamp's age is not evidence of anything yet."
          } >> "$GITHUB_STEP_SUMMARY"
