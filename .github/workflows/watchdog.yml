name: watchdog
# External watchdog. Deliberately NOT running on the machine that hosts the poller --
# a process that dies cannot report its own death.
on:
  # This ran while the repo was private and should not have. Private repos are metered at
  # 2,000 free Actions minutes a month; by 2026-08-24 this cron had logged 42 runs watching a
  # poller that does not start until Week 1, and GitHub bills a minimum of one minute per job,
  # so each ~10s run cost a full minute: roughly 126 runs and 126 minutes a week, about 27% of
  # the allowance, to watch nothing. faffc2a switched it off; c984746 switched it back on at
  # the flip, public repos being unmetered. This is the one place that history is written down.
  #
  # Whether the block below is commented out is checked by `scripts/preflight_public.sh`
  # rather than stated here: the comment that used to state it went on saying SCHEDULE
  # DISABLED after c984746 turned the block on.
  #
  # Each of `pages.yml`'s game windows, **less its first hour**, and nothing else.
  #
  # Two rules, both learned from this file reporting the wrong thing.
  #
  # *Never wider than what it watches.* The watchdog checks the overlay `pages.yml` deploys,
  # so an hour it watches and nothing refreshes is a gap between two schedules being reported
  # as an outage. It used to skip the Thursday and Monday night windows entirely, which was
  # the other direction of the same mismatch: a monitor that is not watching.
  #
  # *Never the opening hour.* Staleness is measured against the last refresh and the refresh
  # runs on the same cadence, so the first tick of a window looks at an artifact last written
  # before the window opened -- an incident by construction, twice a week for eighteen weeks.
  # Starting an hour in means the deploy has already run six times by the first check.
  #
  # The hours follow Eastern in both daylight-saving states, for the reason `pages.yml`
  # spells out. `tests/contracts/test_game_windows.py` asserts both rules against both files.
  schedule:
    - cron: "*/10 17-23 * * 0"   # Sunday daytime, from an hour into the window
    - cron: "*/10 0-5  * * 1"    # Sunday night -- the window has been open since 16:00 UTC
    - cron: "*/10 1-5  * * 2"    # Monday night
    - cron: "*/10 17-23 * * 6"   # Saturday daytime
    - cron: "*/10 0-5  * * 0"    # Saturday night
    - cron: "*/10 1-5  * * 5"    # Thursday night
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The check is a script rather than eight lines of inline shell because it could not
      # pass and nothing could see that. It read `.ts`, which only `hub.fetch.espn.poll`
      # writes -- `hub.publish.live` writes the file the page reads and has never carried
      # that field -- and `jq -r '.ts // 0'` turned the absence into an age of `now - 0`.
      # Every run reported 56.7 years of staleness and none could reach the healthy branch
      # that closes an incident. `tests/contracts/test_watchdog_heartbeat.py` now pins it.
      - name: Check published heartbeat
        id: check
        run: |
          set +e
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/live.json"
          # 1500s, not 600. The overlay is republished every ten minutes during a window,
          # so a 600s threshold has *zero* margin against its own cadence -- and GitHub's
          # scheduled runs drift by minutes under load, on both sides. A monitor that fires
          # because two crons were both late is a monitor that gets ignored.
          #
          # The cost is that a genuinely dead publisher goes unreported for up to twenty-five
          # minutes. The page serves last-good throughout, so that is a delay in learning
          # rather than a delay in the page working.
          RESULT=$(.github/scripts/heartbeat.sh "$URL" 1500)
          echo "age=$(echo "$RESULT" | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          # Three different failures, reported apart, because they have three different
          # fixes: start the poller, republish the site, or reconcile writer and monitor.
          case "$RESULT" in
            ok*)          echo "stale=false" >> "$GITHUB_OUTPUT" ;;
            stale*)       echo "stale=true"  >> "$GITHUB_OUTPUT"
                          echo "why=the published live.json has not been refreshed" >> "$GITHUB_OUTPUT" ;;
            unreachable*) echo "stale=true"  >> "$GITHUB_OUTPUT"
                          echo "age=unknown" >> "$GITHUB_OUTPUT"
                          echo "why=the published live.json could not be fetched" >> "$GITHUB_OUTPUT" ;;
            *)            echo "stale=true"  >> "$GITHUB_OUTPUT"
                          echo "age=unknown" >> "$GITHUB_OUTPUT"
                          echo "why=live.json carries no readable generated_at, so its writer and this check disagree about the schema" >> "$GITHUB_OUTPUT" ;;
          esac

      # `set +e` and the `||` fallbacks are the point of this step, not defensive noise.
      # On 2026-09-04 the label did not exist in the repo, `gh issue create --label` failed,
      # and the whole job exited 1 -- so the watchdog reported nothing at exactly the moment
      # it had something to report. It had passed every earlier run only because the
      # heartbeat was fresh and it never reached this branch: a monitor that works while
      # nothing is wrong. Filing the incident is the job; the label is decoration, and
      # decoration must never be able to silence the alarm.
      - name: File or update the incident issue
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # The marker, not the label. `incident` says what an issue is *about*; this says
          # who filed it. Both branches need it and for the same reason -- the close branch
          # was shutting a human's issue with a comment about the heartbeat, and a dedupe on
          # the label alone would latch onto that same issue and comment on it forever
          # instead of ever filing one of its own, leaving nothing marked for recovery to
          # close. Fixing one half and not the other just moves the failure.
          MARKER="<!-- watchdog-heartbeat -->"
          # Deduped to one open incident at a time, never 200 issues. If the lookup fails the
          # dedupe degrades rather than the step dying -- worst case a second issue, which is
          # noisy and visible, against a silent failure which is neither.
          EXISTING=$(gh issue list --repo "${{ github.repository }}" \
            --label incident --state open --json number,body \
            --jq "([.[] | select(.body | contains(\"$MARKER\"))][0].number) // empty" 2>/dev/null)
          BODY="$MARKER
          Heartbeat age: ${{ steps.check.outputs.age }}s (threshold 1500s).

          Cause: ${{ steps.check.outputs.why }}.

          \`live.json\` is stamped by whatever last wrote it — \`hub.publish.live\` on a slate
          refresh, or \`hub.fetch.espn.poll()\` while it runs. During a game window neither
          having run for ten minutes means the page's scores are frozen.

          The dashboard serves last-good state, so nothing is broken — it is just not moving.
          This issue auto-closes on the next healthy check."
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "Live poller down" --label incident --body "$BODY" \
              || gh issue create --repo "${{ github.repository }}" \
                   --title "Live poller down" --body "$BODY"
          fi
          if [ $? -ne 0 ]; then
            echo "::error::heartbeat is stale AND the incident could not be filed"
            exit 1
          fi

      # Only the incidents this workflow filed. It used to close every open issue carrying
      # the `incident` label, a human's included, with a comment about the heartbeat -- the
      # label describes the subject, not the author. `<!-- watchdog-heartbeat -->` is written
      # into the body above and matched here, so an issue a person opened about a genuine
      # outage survives the next healthy check.
      - name: Close the incident on recovery
        if: steps.check.outputs.stale == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MARKER="<!-- watchdog-heartbeat -->"
          for n in $(gh issue list --repo "${{ github.repository }}" \
                      --label incident --state open --json number,body \
                      --jq ".[] | select(.body | contains(\"$MARKER\")) | .number"); do
            gh issue close "$n" --repo "${{ github.repository }}" --comment "Heartbeat healthy again."
          done
