[project]
name = "football-hub"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "nflreadpy>=0.1",
  "polars>=1.0",
  "pyarrow",
  "requests",
  "espn-api>=0.44",
  "pulp",
  "mapie>=1.0",
  "scikit-learn",
  "python-dotenv",
  "typer",
  "duckdb>=1.1",
  "hydra-core>=1.3",
]

[project.optional-dependencies]
bayes = ["numpyro", "jax", "arviz"]
seq = ["torch"]
dev = ["pytest", "pytest-cov", "ruff", "pyrefly>=1.0", "hypothesis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hub"]


[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Selected explicitly. With no `select`, the lint contract is whatever the installed ruff
# version happens to default to -- and that default has drifted: `ruff check src tests` (what
# CI runs) reported 186 errors under 0.16 against 31 under the documented E4/E7/E9/F. A gate
# whose strictness changes when a dependency updates is not a gate.
#
# DTZ is selected, and `src/` is clean of it as of 2026-08-25. The one production site was
# `market.py`'s `predicted_at` -- the provenance stamp on every prediction row -- written in
# naive local time while `publish.py` used UTC. A repo whose claim is that December can audit
# August cannot have an ambiguous timestamp on the audit trail.
select = ["E", "F", "I", "UP", "B", "C4", "RUF", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# Tests build frames inline and shadow fixtures deliberately.
"tests/*" = ["E501"]
# Test fixtures build fixed datetimes to assert against. A timezone on a literal that exists
# only to be compared to another literal is noise, and changing them would churn stored
# fixtures for no gain.
"tests/**/*.py" = ["E501", "DTZ001", "DTZ005"]

[tool.pyrefly]
project-includes = ["src", "tests"]
# Mirrors `pythonpath` under `[tool.pytest.ini_options]`: `tests/` is an import root so the
# three excision harnesses can share `guardlib`.
search-path = ["src", "tests"]
# CRITICAL: an unconfigured project defaults to the `basic` preset, which silences most
# type errors. A fast checker that finds nothing is worse than a slow one that finds bugs.
preset = "default"
# Third-party stubs are thin across nflreadpy / espn_api / duckdb; do not fail on them.
ignore-missing-imports = ["nflreadpy.*", "espn_api.*", "duckdb.*", "hydra.*", "omegaconf.*"]

[tool.pytest.ini_options]
# `tests` is on the path so the three excision harnesses can share one `guardlib`
# (tests/guardlib.py) instead of keeping three copies of the same marker grammar. The repo
# root deliberately is not on the path: that would expose `site/`, `data/`, `scripts/` and
# `conf/` as importable top-level names, and `site` is a stdlib module.
pythonpath = ["src", "tests"]
testpaths = ["tests"]
# Golden tests hit live third-party APIs. Deselected by default so an upstream outage
# cannot block a docs commit; run them deliberately with `uv run pytest -m golden`.
addopts = "-m 'not golden'"
markers = ["golden: hits a live API; nightly only, never on PRs"]
