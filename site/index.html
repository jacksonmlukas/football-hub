<!doctype html>
<meta charset="utf-8">
<title>football hub</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Inline so the page makes exactly zero requests it cannot satisfy from this repo. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🏈</text></svg>">
<!--
  No build step, no dependencies, no CDN. docs/decisions.md rejected Observable and
  Evidence for wanting a Node build for "four charts and a table", and pulling uPlot from
  a CDN would trade that for an external dependency the page cannot render without. The
  one chart here is a reliability diagram, which is a scatter against a diagonal, and inline
  SVG draws it in fewer lines than a library call.

  The design rule throughout: a panel whose data is missing says so and keeps rendering.
  CLAUDE.md asks for last-good state over errors, so nothing here throws on a bad fetch.
-->
<style>
  :root {
    --bg: #fbfbfa; --fg: #1a1a1a; --muted: #6b7280; --line: #e5e7eb;
    --card: #fff; --warn-bg: #fff7ed; --warn-fg: #9a3412; --warn-line: #fdba74;
    --good: #15803d; --bad: #b91c1c; --accent: #1d4ed8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --fg: #e8e8e8; --muted: #9ca3af; --line: #262a33;
      --card: #161920; --warn-bg: #2a1c0d; --warn-fg: #fbbf24; --warn-line: #78350f;
      --good: #4ade80; --bad: #f87171; --accent: #60a5fa;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.5rem; background: var(--bg); color: var(--fg);
    font: 15px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header { display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap;
           margin-bottom: 1.25rem; }
  h1 { font-size: 1.15rem; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 0.85rem; }
  .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
            padding: 1rem 1.1rem; min-width: 0; }
  h2 { font-size: 0.95rem; margin: 0 0 0.15rem; display: flex; align-items: center;
       gap: 0.5rem; }
  .age { color: var(--muted); font-size: 0.75rem; font-weight: 400; margin-left: auto; }
  .warn { background: var(--warn-bg); color: var(--warn-fg);
          border: 1px solid var(--warn-line); border-radius: 6px;
          padding: 0.5rem 0.65rem; font-size: 0.82rem; margin: 0.6rem 0 0; }
  table { border-collapse: collapse; width: 100%; font-size: 0.85rem; margin-top: 0.7rem; }
  th, td { text-align: right; padding: 0.28rem 0.4rem; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 0.75rem; }
  tbody tr:last-child td { border-bottom: 0; }
  .scroll { overflow-x: auto; }
  .num { font-variant-numeric: tabular-nums; }
  .good { color: var(--good); } .bad { color: var(--bad); }
  .empty { color: var(--muted); font-size: 0.85rem; margin-top: 0.6rem; }
  footer { color: var(--muted); font-size: 0.78rem; margin-top: 1.5rem;
           border-top: 1px solid var(--line); padding-top: 0.8rem; }
  code { font-size: 0.85em; background: var(--line); padding: 0.05rem 0.3rem;
         border-radius: 3px; }

  /* The frozen/live boundary. Shading the live columns is the whole point of 4.3: a
     reader must never have to wonder which numbers moved while the games were on. */
  .grp-live { background: color-mix(in srgb, var(--accent) 9%, transparent); }
  .grp-frozen { opacity: 0.95; }
  .legend { font-size: 0.78rem; color: var(--muted); margin: 0.55rem 0 0; line-height: 1.5; }
  .tag { display: inline-block; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.02em;
         padding: 0.05rem 0.4rem; border-radius: 4px; text-transform: uppercase; }
  .tag.frozen { background: var(--line); color: var(--fg); }
  .tag.live { background: var(--accent); color: #fff; }
  .tag.live::before { content: "● "; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.35 } }
  @media (prefers-reduced-motion: reduce) { .tag.live::before { animation: none } }
</style>

<header>
  <h1>football hub</h1>
  <span class="sub" id="subtitle">loading…</span>
</header>

<div class="grid">
  <section id="p-board"><h2>Draft board <span class="age"></span></h2><div class="body"></div></section>
  <section id="p-roster"><h2>My roster <span class="age"></span></h2><div class="body"></div></section>
  <section id="p-slate"><h2>Weekly slate <span class="age"></span></h2><div class="body"></div></section>
  <section id="p-record"><h2>Track record <span class="age"></span></h2><div class="body"></div></section>
  <section id="p-survivor"><h2>Survivor <span class="age"></span></h2><div class="body"></div></section>
</div>

<footer id="footer"></footer>

<script>
// Every fetch resolves. A panel with no data renders a reason; it never throws and never
// blanks the page. This is the whole reason the manifest exists.
async function load(name) {
  try {
    const r = await fetch(`data/${name}.json?t=${Date.now()}`);
    return r.ok ? await r.json() : null;
  } catch { return null; }
}

const cap = s => s ? s[0].toUpperCase() + s.slice(1) + (/[.!?]$/.test(s) ? "" : ".") : s;
const fmt = (v, d = 2) => (v === null || v === undefined || Number.isNaN(v)) ? "—" : (+v).toFixed(d);
const pct = v => (v === null || v === undefined) ? "—" : (100 * v).toFixed(1) + "%";

function ago(iso) {
  if (!iso) return "never";
  const mins = Math.round((Date.now() - new Date(iso)) / 60000);
  if (!Number.isFinite(mins)) return "unknown";
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins}m ago`;
  const h = Math.round(mins / 60);
  return h < 48 ? `${h}h ago` : `${Math.round(h / 24)}d ago`;
}

// Everything that reaches innerHTML from a feed goes through this first. Player names,
// team names and status text come from ESPN and nflverse; an apostrophe or an ampersand in
// a name is enough to produce malformed markup, and anything angle-bracketed is injected
// into the page. This site is public, unattended, and refreshed twice a week by a workflow
// with a push token -- nobody is watching it render.
// GUARD esc-escapes-what-reaches-the-page: nothing off a feed reaches innerHTML as markup.
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// /GUARD

function panel(id, { age, warn, html }) {
  const el = document.getElementById(id);
  el.querySelector(".age").textContent = age ?? "";
  el.querySelector(".body").innerHTML =
    (warn ? `<p class="warn">${esc(warn)}</p>` : "") + (html ?? "");
}

// Escapes by default, so a column cannot forget. Getters return *text*, never markup --
// which is why the em dash below is the character rather than `&mdash;`. Relying on each
// call site to remember is how one of a dozen columns ends up unescaped.
function table(cols, rows) {
  // GUARD table-escapes-every-cell: every cell and header is escaped here, not at the call site.
  const head = cols.map(c => `<th>${esc(c.label)}</th>`).join("");
  const body = rows.map(r =>
    `<tr>${cols.map(c => `<td class="num ${c.cls ? c.cls(r) : ""}">${esc(c.get(r))}</td>`).join("")}</tr>`
  ).join("");
  // /GUARD
  return `<div class="scroll"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

// Reliability diagram. Perfect calibration is the diagonal; dot area is the bin count,
// because a bin holding four games should not look like one holding sixty.
function reliabilitySVG(bins) {
  const filled = bins.filter(b => b.n > 0);
  if (!filled.length) return "";
  const S = 190, pad = 26, span = S - 2 * pad;
  const maxN = Math.max(...filled.map(b => b.n));
  const x = v => pad + v * span, y = v => S - pad - v * span;
  const dots = filled.map(b => {
    const r = 3 + 5 * Math.sqrt(b.n / maxN);
    return `<circle cx="${x(b.predicted).toFixed(1)}" cy="${y(b.actual).toFixed(1)}" r="${r.toFixed(1)}"
             fill="var(--accent)" fill-opacity="0.65"><title>${esc(b.bin)}: n=${b.n}, predicted ${pct(b.predicted)}, actual ${pct(b.actual)}</title></circle>`;
  }).join("");
  return `<svg viewBox="0 0 ${S} ${S}" width="100%" style="max-width:230px;margin-top:0.6rem">
    <line x1="${pad}" y1="${S - pad}" x2="${S - pad}" y2="${pad}"
          stroke="var(--muted)" stroke-dasharray="3 3" stroke-width="1"/>
    <line x1="${pad}" y1="${S - pad}" x2="${S - pad}" y2="${S - pad}" stroke="var(--line)"/>
    <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${S - pad}" stroke="var(--line)"/>
    ${dots}
    <text x="${S / 2}" y="${S - 6}" text-anchor="middle" font-size="9" fill="var(--muted)">predicted</text>
    <text x="9" y="${S / 2}" font-size="9" fill="var(--muted)" transform="rotate(-90 9 ${S / 2})" text-anchor="middle">actual</text>
  </svg>`;
}

// The track record panel's body.
//
// Split out of `render` because it has two payload shapes to serve and neither can be
// exercised in a browser without publishing an artifact first: `publish.track_record`
// scores each season on its own curve, and the committed `track_record.json` will not carry
// a `seasons` key until the next slate runs. A panel that needed the new key to render
// would go blank on the deploy that shipped it.
function trackRecordBody(tr) {
  const pre = tr.n_preregistered ?? 0;
  // Newest season first, by contract with the writer: `tr.log_loss`, `tr.brier` and
  // `tr.bins` are that season's numbers rather than a pool. Pooling 2025's sixteen scored
  // games with 2026's reports a curve neither season was measured at -- the 2025 model, its
  // fitted parameters and the betting market it was priced against are not the 2026 ones,
  // and a bin holding nine games from each hides that it is holding two answers.
  const seasons = Array.isArray(tr.seasons) ? tr.seasons : [];
  const newest = seasons[0] ?? null;
  const chart = reliabilitySVG(tr.bins ?? []);

  // The framing, which decides how everything under it is read and is the whole of what
  // this panel withholds. `n_preregistered` stays 0 until a prediction's commit predates
  // kickoff, so it is the branch every artifact committed so far lands in; withholding the
  // numbers here as well -- as this did for one revision -- meant showing nobody a
  // calibration at all, while the branch that had them was code no artifact could reach.
  // Refusing to present a backtest *as a record* is the honest claim and this sentence is
  // it: the numbers below are labelled by it rather than hidden behind it.
  //
  // Both branches share this line, and that is a deliberate change to the branch nobody
  // asked about: the pre-registered count used to be a `{ k, v }` row inside the metrics
  // table, and lifting it out is what lets one table serve both framings instead of two
  // tables differing by a row. Recorded here so the next reader does not read it as drift.
  const lede = pre === 0
    ? `<p class="empty">${esc(tr.note ?? "")}</p>` +
      (tr.n_scored ? `<p class="empty">${esc(tr.n_scored)} predictions scored
         retrospectively. That is a backtest, not a record, and it is not shown as one.</p>`
                   : "")
    : `<p class="legend">${esc(pre)} pre-registered, ${esc(tr.n_scored ?? 0)} scored.</p>`;

  if (!newest) {
    // An artifact from before the split. Its numbers are pooled and nothing here can unpool
    // them, so they are shown as they are rather than relabelled with a season they were
    // never scored by.
    return lede + table([
      { label: "metric", get: r => r.k },
      { label: "value", get: r => r.v },
    ], [
      { k: "log loss", v: fmt(tr.log_loss, 4) },
      { k: "Brier", v: fmt(tr.brier, 4) },
    ]) + chart;
  }
  // Whose curve the diagram is. `publish.track_record` groups rows carrying no season under
  // `season: null` and orders that group last, so it is the *newest* group only when every
  // scored row is undated -- the shape `preds_wk18.json` had before the season joined the
  // filename. "Calibration for ." is not a sentence, and a caption with a hole in it is how
  // a reader learns to distrust the numbers beside it.
  const whose = newest.season == null ? "the predictions with an unrecorded season"
                                      : String(newest.season);
  return lede + table([
    { label: "season", get: r => r.season ?? "unrecorded" },
    { label: "scored", get: r => r.n_scored },
    { label: "log loss", get: r => fmt(r.log_loss, 4) },
    { label: "Brier", get: r => fmt(r.brier, 4) },
  ], seasons) + chart +
    // The diagram draws one group's bins. Unlabelled, under a table of several seasons, it
    // reads as the pool -- which is the reading the split exists to prevent.
    (chart ? `<p class="legend">Calibration for ${esc(whose)}. Each season is
       scored on its own curve.</p>` : "");
}

function findArt(man, name) {
  return (man?.artifacts ?? []).find(a => a.name === name) ?? null;
}

// The manifest's entry for this week's predictions -- name, stale flag and reason in one
// lookup, because they are one fact.
//
// Read, never rebuilt. `publish.preds_name` owns the spelling and `store.week_key` owns the
// zero-pad inside it; this page can import neither, so building the name here kept a second
// copy of both rules in a language that cannot be held in step with the first. It had
// already drifted: `manifest.json` listed `preds_wk01` beside a committed
// `preds_2026_wk01.json`, so `findArt` matched nothing and the slate lost its stale and
// reason reporting with no error anywhere -- the file still loaded, because the *other*
// copy of the rule happened to be the right one. There is no fallback that spells a name
// this page could not read: a guessed name fetches nothing and reports the 404 as a week
// that was never published, which is a lie about the record.
//
// No week argument, deliberately. `publish.artifacts` emits exactly one `preds_`-prefixed
// entry per manifest, so there is nothing here to disambiguate; if it ever emitted several,
// the rule for choosing between them would be the writer's to state, and a page picking one
// on its own would be guessing again.
function predsArt(man) {
  return (man?.artifacts ?? []).find(a => String(a?.name ?? "").startsWith("preds_")) ?? null;
}

// The published weeks a reader can reach other than the one on screen.
//
// The manifest describes the week it was written for and nothing else, so an older artifact
// is not discoverable from this page at all: `preds_2025_wk18.json` is committed, is the
// sixteen games the track record is scored from, and until now no reader could open it --
// issue #23 asks that the site render both. These are names the writer wrote, copied once;
// copying `preds_name`'s *output* is not the same as keeping a second copy of `preds_name`,
// and a name that stops resolving is a broken link rather than a silently wrong fetch.
// `tests/contracts/test_dashboard_escapes.py` pins each one to a file that is committed.
// When `publish` starts listing what it has published, this list goes.
const ARCHIVE = [{ name: "preds_2025_wk18", label: "2025 week 18" }];

function otherWeeks(man, shown) {
  // The current week's label is the manifest's claim about it, which is all there is before
  // its artifact has been fetched. The legend corrects it from the artifact on arrival.
  const art = predsArt(man);
  const current = art
    ? [{ name: art.name, label: `${man?.season ?? "?"} week ${man?.week ?? "?"}` }] : [];
  return [...current, ...ARCHIVE].filter(w => w.name !== shown);
}

// ESPN to nflverse, and the direction matters. Compared against a live scoreboard and a
// published slate, exactly two abbreviations differ: ESPN writes LAR and WSH where
// nflverse writes LA and WAS. Predictions are keyed by nflverse game_id, so ESPN is the
// side that gets translated.
//
// This map was initially written the other way round, which silently dropped the Rams
// game from the overlay every week -- a missing row reads as "not on the board", which is
// a legitimate state, so nothing would have looked wrong.
const TEAM_ALIAS = { LAR: "LA", WSH: "WAS" };
const teamKey = t => TEAM_ALIAS[t] ?? t;

// The slate is the one panel mixing two clocks: model numbers frozen at lock, scores
// moving. Everything here exists to keep that boundary visible -- the frozen columns are
// captioned with when they were locked, the live columns are shaded and captioned with
// how old the scores are, and a game with no live match says so rather than showing a
// blank that could be read as 0-0.
// Predictions are fetched at most once per artifact per page load and kept here. The poll
// below must not be able to replace them even by accident: making the freeze structural
// rather than a convention is the point of 4.3, and a re-fetch on a timer is precisely how
// a "frozen" number quietly starts moving. Keyed by the artifact's own name, so that
// reading an archived week cannot disturb the current one and the key always names the
// artifact that was actually served.
const frozenPreds = new Map();

async function frozen(key) {
  // The promise rather than its result: filling the map only after the await leaves a
  // window in which a second caller fetches the same artifact again, and "fetched once" is
  // the property this is for.
  if (!frozenPreds.has(key)) frozenPreds.set(key, load(key));
  return frozenPreds.get(key);
}

// The archived week a reader asked for, and the manifest the slate last rendered against.
// Both live out here because the link that switches weeks is handled by delegation below:
// every panel is rebuilt through innerHTML, so a listener bound to the link itself would
// not survive the next render.
let viewing = null;
let slateMan = null;

async function renderSlate(man) {
  slateMan = man;
  // The artifact this week was published as, named by whoever wrote it. See `predsArt`.
  const pArt = predsArt(man);
  const key = viewing ?? pArt?.name ?? null;
  const preds = key ? await frozen(key) : null;
  // The manifest describes the week it published and not an archived one, so its staleness
  // and its reason belong to the panel only while that is what the panel is showing.
  const art = viewing ? null : pArt;

  // The other published weeks, as links: issue #23 asks the site to render both, and the
  // only week reachable until now was whichever one the manifest happened to name.
  const links = otherWeeks(man, key)
    .map(w => `<a href="#" data-preds="${esc(w.name)}">${esc(w.label)}</a>`).join(", ");
  const also = links ? `<p class="legend">Also published: ${links}</p>` : "";

  if (!preds?.rows?.length) {
    panel("p-slate", {
      age: "",
      warn: art?.reason ? `No slate: ${art.reason}`
          : viewing ? "That published week could not be loaded."
          : key ? "No predictions published yet."
                : "No slate: the manifest names no published week.",
      // The links survive the empty case on purpose: a week that could not be published is
      // exactly when a reader wants the one that was.
      html: also,
    });
    return;
  }

  // Scores are joined only for the week the manifest names. The live map is keyed by the
  // matchup alone, and three of 2026 week 1's fixtures repeat 2025 week 18's -- so reaching
  // the older week put tonight's score beside a prediction made for a different season's
  // game, under a column captioned "live". An archived week gets no overlay at all rather
  // than a plausible wrong one.
  const live = viewing ? null : await load("live");
  const byGame = new Map();
  for (const g of live?.rows ?? []) {
    byGame.set(`${teamKey(g.away)}_${teamKey(g.home)}`, g);
  }

  const rows = preds.rows.slice(0, 16).map(r => {
    const teams = (r.game_id ?? "").replace(/^\d+_\d+_/, "");
    return { ...r, teams, live: byGame.get(teams) ?? null };
  });
  const matched = rows.filter(r => r.live).length;

  const lockedAt = preds.rows[0]?.predicted_at ?? preds.generated_at;
  const liveAge = viewing ? "not shown for a week that is over"
                : live ? ago(live.generated_at) : "unavailable";
  // Which week this slate is, stated in the panel rather than only in the page subtitle.
  // `site/data/` holds two published weeks -- 2025 week 18 and 2026 week 01 -- and a panel
  // headed "Weekly slate" showing "week 18" does not say which of them is on screen; the
  // subtitle is a page-level fact a reader scanning one panel need never have seen.
  //
  // Off the artifact and nothing else. The manifest names the week it was *written* for,
  // which is precisely the one week that can disagree with the rows on screen -- reading it
  // as a fallback would reintroduce the skew this panel exists to make visible, and an
  // archived week is not the manifest's week at all. An artifact that does not say which
  // week it is says so rather than borrowing an answer.
  const shownSeason = preds.season ?? preds.rows[0]?.season;
  const shownWeek = preds.week ?? preds.rows[0]?.week;
  const stamp = (shownSeason != null && shownWeek != null)
    ? `${shownSeason} week ${shownWeek}` : "an unrecorded season and week";
  const head = `
    <p class="legend">
      <b>${esc(stamp)}</b>.
      <span class="tag frozen">frozen</span> model numbers, locked ${ago(lockedAt)} — these
      do not move once games start.
      <span class="tag live">live</span> scores, ${liveAge}.
    </p>`;

  const body = `<div class="scroll"><table>
    <thead>
      <tr>
        <th></th>
        <th colspan="3" class="grp-frozen">frozen at lock</th>
        <th colspan="2" class="grp-live">live</th>
      </tr>
      <tr>
        <th>game</th>
        <th class="grp-frozen">home win</th><th class="grp-frozen">margin</th>
        <th class="grp-frozen">80% range</th>
        <th class="grp-live">score</th><th class="grp-live">status</th>
      </tr>
    </thead>
    <tbody>${rows.map(r => `
      <tr>
        <td>${esc(r.teams)}</td>
        <td class="num grp-frozen">${pct(r.home_win_prob)}</td>
        <td class="num grp-frozen">${fmt(r.margin_mean, 1)}</td>
        <td class="num grp-frozen">${fmt(r.margin_lo, 0)} … ${fmt(r.margin_hi, 0)}</td>
        <td class="num grp-live">${r.live ? `${esc(r.live.away_score)}–${esc(r.live.home_score)}` : "—"}</td>
        <td class="num grp-live">${r.live ? esc(r.live.detail ?? r.live.state) : "not on the board"}</td>
      </tr>`).join("")}
    </tbody></table></div>`;

  panel("p-slate", {
    age: `${preds.n} games · ${matched} live`,
    warn: art?.stale ? `Stale: ${art.reason ?? "unknown"}`
        : viewing ? "An earlier published week, kept exactly as it was committed."
        : (!live ? "Live scores unavailable — model numbers below are still correct."
                 : (matched === 0 ? "No live game matches this slate; scores column is idle."
                                  : null)),
    html: head + body + also,
  });
}

async function render() {
  const man = await load("manifest");
  const wk = man?.week ?? "?";
  document.getElementById("subtitle").textContent =
    man ? `${man.season} · week ${wk} · published ${ago(man.generated_at)}`
        : "no manifest — run `make slate`";

  // --- draft board
  const board = await load("draft_board");
  const bArt = findArt(man, "draft_board");
  if (Array.isArray(board) && board.length) {
    const rows = board.filter(r => r.vor != null).slice(0, 12);
    panel("p-board", {
      age: `${board.length} players`,
      warn: bArt?.stale ? `Stale: ${bArt.reason ?? "unknown"}` : null,
      html: table([
        { label: "player", get: r => r.player ?? "" },
        { label: "pos", get: r => r.pos ?? "" },
        { label: "VOR", get: r => fmt(r.vor, 1) },
        { label: "edge", get: r => fmt(r.edge, 1), cls: r => r.edge > 0 ? "good" : "" },
        { label: "SoS", get: r => fmt(r.wk15_17_sos, 2) },
      ], rows),
    });
  } else {
    // Backticks, not `<code>`: `warn` is escaped, and the manifest's own reason strings
    // ("run `python -m hub.season.roster --write`") already read this way.
    panel("p-board", { age: "", warn: "No draft board. Run `make draft`." });
  }

  // --- my roster, and where the set lineup differs from the best one
  const ros = await load("roster");
  const rArt = findArt(man, "roster");
  if (ros && Array.isArray(ros.rows) && ros.rows.length) {
    // The gain is stated with its caveat attached rather than as a headline number. mu is
    // the board's season-long projection, so it does not know who is hurt this week.
    const gain = ros.gain;
    const held = (ros.withheld ?? []);
    // Withheld players are named first: the recommendation is only trustworthy if the reader
    // can see who was taken out of it and why.
    const heldNote = held.length
      ? `<p class="warn">Withheld as unavailable: <b>${esc(held.join(", "))}</b>. ESPN's injury
           field does not carry suspensions; its games projection does, and these are short of
           a full slate. They are excluded from the lineup below.</p>`
      : "";
    const note = gain == null
      ? `<p class="empty">No lineup could be filled from the available players.</p>`
      : gain > 0.05
        ? `<p class="warn">The set lineup projects ${fmt(ros.set_total, 1)}; the best available
             one projects ${fmt(ros.optimal_total, 1)}, a difference of <b>${fmt(gain, 1)}</b>
             a week &mdash; start ${esc((ros.start ?? []).join(", "))} over
             ${esc((ros.sit ?? []).join(", "))}. These projections are season-long and do not know
             who is hurt this week, so settle it at lock.</p>`
        : `<p class="empty">The set lineup is already the best available one.</p>`;
    panel("p-roster", {
      age: `${ros.n} rostered`,
      warn: rArt?.stale ? `Stale: ${rArt.reason ?? "unknown"}` : null,
      html: heldNote + note + table([
        { label: "", get: r => r.starting ? "S" : "", cls: r => r.starting ? "good" : "" },
        { label: "pos", get: r => r.pos ?? "" },
        { label: "player", get: r => r.player ?? "" },
        { label: "proj", get: r => r.projected ? fmt(r.mu, 1) : "\u2014" },
        { label: "+/-", get: r => r.projected ? fmt(r.sd, 1) : "" },
        { label: "best XI", get: r => r.best_start ? "\u2713" : "",
          cls: r => r.best_start && !r.starting ? "good" : "" },
        { label: "status", get: r =>
            r.available === false ? `out ${r.missing_games} gm`
              : ["ACTIVE", "NORMAL", ""].includes(r.injury_status) ? "" : r.injury_status,
          cls: r => r.available === false ? "bad" : "" },
      ], ros.rows),
    });
  } else {
    panel("p-roster", {
      age: "",
      warn: "No roster yet. Run `python -m hub.season.roster --write`.",
      html: `<p class="empty">Knowable only after the draft, which is why this panel was
             empty all summer.</p>`,
    });
  }

  // --- weekly slate, with the live overlay
  await renderSlate(man);

  // --- track record
  const tr = await load("track_record");
  if (tr) {
    panel("p-record", { age: ago(tr.generated_at), html: trackRecordBody(tr) });
  } else {
    panel("p-record", { age: "", warn: "No track record published yet." });
  }

  // --- survivor
  const sArt = findArt(man, "survivor");
  const surv = await load("survivor");
  const sRows = Array.isArray(surv?.rows) ? surv.rows : [];
  if (sRows.length) {
    // The unpriced weeks matter more than the plan does. In August the board runs a few
    // weeks deep, so a plan covering 12 of 18 is the honest answer and a plan that did not
    // say so would read as a season.
    const missing = surv.unpriced_weeks ?? [];
    // The plan's scope, not the season's. Spending a team early costs you that team later,
    // so a mid-season plan is over the weeks that remain and against the teams that are
    // left -- and a survival probability means nothing without the weeks it is over.
    const gone = surv.spent ?? [];
    const from = sRows[0]?.week;
    panel("p-survivor", {
      age: `${sRows.length} weeks from wk ${from} · survives ${pct(surv.survival ?? 0)}`,
      warn: sArt?.stale ? `Stale: ${sArt.reason ?? "unknown"}`
          : (missing.length
             ? `Weeks ${missing.join(", ")} have no posted spread yet and still need a pick.`
             : null),
      html: (gone.length
              ? `<p class="empty">Already spent and unavailable: ${esc(gone.join(", "))}.
                   Read from the last published plan, so it is what was planned rather than
                   what was entered.</p>`
              : "") + table([
        { label: "week", get: r => r.week },
        { label: "team", get: r => r.team ?? "" },
        { label: "win", get: r => pct(r.win_prob) },
      ], sRows),
    });
  } else {
    panel("p-survivor", {
      age: "",
      warn: sArt?.reason ? cap(sArt.reason) : "No survivor plan published.",
      html: `<p class="empty">The panel stays so the gap is visible rather than silently absent.</p>`,
    });
  }

  const stale = (man?.artifacts ?? []).filter(a => a.stale);
  document.getElementById("footer").innerHTML = stale.length
    ? `${stale.length} of ${man.artifacts.length} panels stale: ${esc(stale.map(a => a.name).join(", "))}.
       Panels show last-good data rather than going blank.`
    : `All panels current. Regenerate with <code>make slate</code>.`;
}

// Poll only the slate. The other three panels read artifacts that change once a week, and
// re-fetching predictions on a timer is exactly the failure this design prevents: a model
// number that moves during a game is worthless as a pre-registered claim, however good it
// looks. `render()` runs once; only scores are allowed a clock.
const LIVE_POLL_MS = 45000;
let manifestCache = null;

async function tick() {
  // Not while a reader is looking at an archived week. That week's games are over, so the
  // timer has nothing to add, and redrawing the panel under them would take their choice
  // away -- which is how a page teaches a reader not to click anything.
  if (!manifestCache || viewing) return;
  await renderSlate(manifestCache);
}

// Switching weeks. Delegated from the document because the panel is rebuilt through
// innerHTML on every render, so a listener bound to the link would not survive one.
document.addEventListener("click", (e) => {
  const link = e.target.closest?.("[data-preds]");
  if (!link) return;
  e.preventDefault();
  const pick = link.getAttribute("data-preds");
  // Choosing the manifest's own week is "back to now", which puts the live poll back in
  // charge; choosing any other stops it, per `tick`.
  viewing = pick === predsArt(slateMan)?.name ? null : pick;
  renderSlate(slateMan);
});

render().then(async () => { manifestCache = await load("manifest"); });
setInterval(tick, LIVE_POLL_MS);
</script>
